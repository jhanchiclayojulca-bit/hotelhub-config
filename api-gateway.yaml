spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**
            - id: audit-service
              uri: lb://AUDIT-SERVICE
              predicates:
                - Path=/api/audit/**
            - id: hotel-service
              uri: lb://HOTEL-SERVICE
              predicates:
                - Path=/api/hotels/**
            - id: storage-service
              uri: lb://STORAGE-SERVICE
              predicates:
                - Path=/api/storage/**
            - id: pricing-service
              uri: lb://PRICING-SERVICE
              predicates:
                - Path=/api/pricing/**
            - id: room-service
              uri: lb://ROOM-SERVICE
              predicates:
                - Path=/api/rooms/**
            - id: reservation-service
              uri: lb://RESERVATION-SERVICE
              predicates:
                - Path=/api/reservations/**
            - id: cash-management-service
              uri: lb://CASH-MANAGEMENT-SERVICE
              predicates:
                - Path=/api/cash/**
            - id: payment-service-general
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/payments/**
            - id: reporting-service
              uri: lb://REPORTING-SERVICE
              predicates:
                - Path=/api/reports/**
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**

server:
  port: ${SERVER_PORT:8080}
